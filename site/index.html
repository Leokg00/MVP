<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Public Beach Water Quality</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Leaflet: the map library. Loaded from the internet, nothing to install. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <main class="story">
      <h1>Public Beach Water Quality</h1>
      <nav id="city-bar"></nav>
      <h2 id="panel-title">Toronto Beach Water Quality</h2>
      <div id="panel-text"></div>
      <p id="status">Loading data ...</p>
    </main>
        <div class="mapwrap">
      <div id="map"></div>
      <!-- Only shown while a past rain-event day is on the map, so the reader
           is never looking at historical data without being told the date. -->
      <div id="event-banner" hidden
           style="position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;
                  background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.3);
                  padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center"></div>
      <div id="map-error" hidden
     style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;
            max-width:280px;background:#fff;border-left:5px solid #b3261e;border-radius:6px;
            box-shadow:0 2px 12px rgba(0,0,0,.3);padding:12px 14px;font-size:14px"></div>
      <div class="legend">
        <strong>E. coli (per 100 mL)</strong><br>
        <span style="background:#2ca02c"></span>Safe (&le; 100)<br>
        <span style="background:#d62728"></span>Unsafe (&gt; 100)<br>
        <span style="background:#1b998b"></span>Nearby park
        <div id="legend-unsampled" hidden>
          <span style="background:#e8c547;border:2px solid #b8860b;box-sizing:border-box"></span>Not sampled that day
        </div>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
